name: TeleBridge dashboard checks

on:
  pull_request:
  push:
    branches: [main, feat/telebridge-recovery-hub, feat/telebridge-web-dashboard]

jobs:
  dashboard:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: python -m pip install --upgrade pip && pip install -r requirements.txt
      - name: Run unit tests
        run: python -m unittest discover -s tests -v
      - name: Compile Python modules
        run: python -m compileall -q webapp.py telegram_channel_duplicator tests
