[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "telegram-channel-duplicator"
version = "0.8.1"
description = "Telegram channel mirroring and account recovery with encrypted session backups"
readme = "README.md"
requires-python = ">=3.9"
# Upstream does not declare a license; see BUILD.md before redistributing.
authors = [{ name = "deFiss" }]
keywords = ["telegram", "telethon", "channel", "mirroring"]
classifiers = [
    "Programming Language :: Python :: 3",
    "Environment :: Console",
    "Intended Audience :: End Users/Desktop",
    "Topic :: Communications :: Chat",
]
dependencies = [
    "colorama>=0.4.6",
    "loguru>=0.7.2",
    "PyYAML>=6.0.1",
    "python-dotenv>=1.0",
    "pytz>=2024.1",
    "Telethon>=1.34,<2",
    "cryptography>=42",
    "Pillow>=10",
    "qrcode>=7.4,<9",
    "zxing-cpp>=2.2,<4",
]

[project.optional-dependencies]
dev = ["pytest>=8", "build>=1.2"]

[project.scripts]
telegram-channel-duplicator = "telegram_channel_duplicator.cli:main"

[project.urls]
Source = "https://github.com/leephil1907-lab/telegram_channel_duplicator"
Upstream = "https://github.com/deFiss/telegram_channel_duplicator"

[tool.setuptools]
packages = ["telegram_channel_duplicator"]

[tool.setuptools.package-data]
telegram_channel_duplicator = ["dashboard.html"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
